<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Phoenix AI</title>
    <link rel="stylesheet" href="phoenix-desktop-pet.css">
    <script src="phoenix-desktop-pet.js" defer></script>
  </head>
  <body>
    <section id="details" class="details" aria-labelledby="details-title" hidden>
      <header><span id="details-title">Phoenix AI</span><a id="collapse" href="?action=details">×</a></header>
      <h2 id="balance-title">API balance</h2>
      <div id="balance" class="balance" role="status"></div>
      <h2 id="work-title">Current sessions</h2>
      <ul id="work"></ul>
    </section>
    <a class="pet" id="mascot-button" href="?action=details" aria-label="Show balance and sessions" aria-expanded="false">
      <svg class="mascot" viewBox="0 0 108 112" aria-hidden="true">
        <defs>
          <linearGradient id="fire" x1="15%" y1="8%" x2="85%" y2="98%">
            <stop stop-color="#ffb21e"/>
            <stop offset=".48" stop-color="#ff7900"/>
            <stop offset="1" stop-color="#f24b0a"/>
          </linearGradient>
        </defs>
        <ellipse cx="53" cy="103" rx="33" ry="5" fill="#27140f" opacity=".22"/>
        <path d="M40 84v16h-8m31-16v16h8" stroke="#57362a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <g class="body">
          <path d="M27 69c-4 7-8 11-13 12m64-13c5 8 10 12 15 11" stroke="#57362a" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="13" cy="81" r="3" fill="#ff7900"/>
          <circle cx="94" cy="79" r="3" fill="#ff7900"/>
          <path fill="url(#fire)" transform="translate(5 -2)" d="M48 91c-19.4 0-34-13.5-34-31.4C14 43.8 24.2 32 31.8 23.2c-.1 8.4 3.1 13.2 7.7 13.9C49 34 55.5 22.7 58.7 8c11.4 9.6 16.8 19.2 16.3 29.3 8.5 7.2 12.9 14.9 12.9 24.2C87.9 78 69.6 91 48 91Z"/>
          <g class="eyes" fill="#27140f">
            <circle cx="40" cy="56" r="3.2"/>
            <circle cx="66" cy="56" r="3.2"/>
          </g>
          <g class="typing">
            <path d="M23 79h61l6 16H16z" fill="#633728" stroke="#47231a" stroke-width="2"/>
            <path d="M27 85h5m5 0h5m5 0h5m5 0h5m5 0h5m5 0h5m-41 5h28" fill="none" stroke="#ffac43" stroke-width="2.5" stroke-linecap="round"/>
            <circle class="typing-hand hand-left" cx="34" cy="81" r="5" fill="#ff980e"/>
            <circle class="typing-hand hand-right" cx="70" cy="81" r="5" fill="#ff980e"/>
          </g>
          <path d="M44 69c5.7 5.1 13.8 5.1 19 0" fill="none" stroke="#27140f" stroke-width="3.4" stroke-linecap="round"/>
        </g>
      </svg>
    </a>
    <div class="controls">
      <span id="drag" class="drag" aria-hidden="true"></span>
      <a id="open" href="phoenix-desktop-pet.html?action=open" aria-label="Open Phoenix AI" title="Open Phoenix AI">↗</a>
      <a id="hide" href="phoenix-desktop-pet.html?action=hide" aria-label="Hide desktop pet" title="Hide desktop pet">×</a>
    </div>
  </body>
</html>
