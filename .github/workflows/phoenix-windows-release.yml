name: Phoenix Windows installer release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Phoenix Windows workflow run id
        required: true
        type: string
      artifact_name:
        description: Artifact name produced by the source run
        required: true
        type: string
      release_tag:
        description: Unique prerelease tag
        required: true
        type: string
      source_sha:
        description: Commit built by the source run
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified installer artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: phoenix-windows
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find phoenix-windows -type f -name 'phoenix-ai-*.exe' -print)
          test "${#installers[@]}" -eq 1
          test -f phoenix-windows/phoenix-windows-sha256.txt
          sha256sum "${installers[0]}"
      - name: Publish unsigned test installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Phoenix AI Windows ${SOURCE_SHA:0:8}" \
            --notes "Unsigned Phoenix AI Windows x64 test installer built from commit $SOURCE_SHA. Windows may show a SmartScreen warning because this candidate is not code-signed." \
            --prerelease \
            phoenix-windows/phoenix-ai-*.exe \
            phoenix-windows/phoenix-windows-sha256.txt
