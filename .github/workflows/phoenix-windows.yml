name: Phoenix Windows test installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-windows-test
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DSH_CLIENT_BRAND: phoenix
      DSH_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check packaging configuration
        run: pnpm exec vitest run apps/desktop/tests/desktop-package-environment.spec.ts apps/desktop/tests/windows-package-preset.spec.ts
      - name: Build unsigned Phoenix installer
        run: pnpm --dir apps/desktop run package:win:x64:unsigned
      - name: Verify installer and record checksums
        run: |
          $files = @(Get-ChildItem apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts -Filter 'phoenix-ai-*.exe')
          if ($files.Count -eq 0) { throw 'Phoenix installer was not generated' }
          $files | Get-FileHash -Algorithm SHA256 | Format-List | Out-File phoenix-windows-sha256.txt
      - name: Retain test installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phoenix-windows-x64-${{ github.run_number }}
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/phoenix-ai-*.exe
            phoenix-windows-sha256.txt
          if-no-files-found: error
          retention-days: 3
